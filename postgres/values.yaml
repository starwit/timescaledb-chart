image:
  repository: postgres
  tag: 17.6
  pullPolicy: IfNotPresent

auth:
  username: postgres # name of super user
  postgressPassword: secretpassword # password for super user
  database: myappdb # name of custom database
  password: userpassword # password for custom user

init:
  enabled: true
  init_user_db: |
    -- Create additional schemata, users, enable extensions, ...
    CREATE USER myappdb WITH PASSWORD 'password';    
    CREATE DATABASE "myappdb" owner myappdb;

  init_tables: | 
    -- Create tables
    \connect myappdb
    CREATE TABLE IF NOT EXISTS metrics (
      time TIMESTAMPTZ NOT NULL,
      value DOUBLE PRECISION NULL
    );

service:
  type: ClusterIP
  port: 5432

persistence:
  enabled: true
  size: 20Gi
  storageClass: ""

resources: {}